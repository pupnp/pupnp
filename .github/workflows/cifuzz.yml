name: CIFuzz

on:
  # CIFuzz builds every target and then fuzzes for 5 minutes, so it is too
  # expensive to run on every pull request. Run it on demand, and
  # automatically only when the fuzzing harnesses themselves change.
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
      - "!no_ci-*"
    paths:
      - "fuzzer/**"

permissions:
  contents: read

jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    steps:
      - name: Build Fuzzers
        id: build
        uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@master
        with:
          oss-fuzz-project-name: "pupnp"
          dry-run: false
      - name: Run Fuzzers
        uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@master
        with:
          oss-fuzz-project-name: "pupnp"
          fuzz-seconds: 300
          dry-run: false
      - name: Upload Crash
        uses: actions/upload-artifact@v7
        if: failure() && steps.build.outcome == 'success'
        with:
          name: artifacts
          path: ./out/artifacts
